############################### Plugins ############################### > start
plugins:
  ################ required plugins ################
  # jquery
  globalJquery:
    enable: false # 全局引入 jquery
    js: https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js
  # fontawesome
  fontawesome:
    enable: true
    js: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.min.css
  # busuanzi 不蒜子统计
  busuanzi:
    enable: false
    js: https://cdn.jsdelivr.net/npm/busuanzi@2.3.0/bsz.pure.mini.js
  ######## Plugins to optimize the experience:
  # 代码高亮
  code_highlight: highlightjs # highlightjs or prismjs
  # highlight.js
  highlightjs:
    copy_code: true
    # 如果开启以下配置, hexo.config.highlight.enable 需要设置为 false ; hexo.config.highlight.enable 设置为 true, 则以下配置无效
    # # 不再支持 v11.1.0 以下版本
    # js: https://unpkg.com/@highlightjs/cdn-assets@11.5.1/highlight.min.js # Please set hexo.config.highlight.enable = false !!!
    # css: https://unpkg.com/@highlightjs/cdn-assets@11.5.1/styles/default.min.css
    # # # more: https://www.jsdelivr.com/package/npm/@highlightjs/cdn-assets?path=styles

  # prismjs
  # https://prismjs.com/
  # https://hexo.io/zh-cn/docs/syntax-highlight#PrismJS
  prismjs:
    copy_code: true
    # Please set hexo.config.highlight.enable = false !!! set hexo.config.prismjs.enable = true !!!
    js:
      - https://unpkg.com/prismjs/components/prism-core.min.js
      - https://unpkg.com/prismjs/plugins/autoloader/prism-autoloader.min.js
      - https://unpkg.com/prismjs/plugins/line-numbers/prism-line-numbers.min.js
    css:
      - https://unpkg.com/prismjs/themes/prism-dark.css
      - https://unpkg.com/prismjs/plugins/line-numbers/prism-line-numbers.css

  # Pjax
  pjax:
    enable: true
    js: https://cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js
    timeout: 5000        # The timeout in milliseconds for the XHR requests. Set to 0 to disable the timeout.
    cacheBust: false     # When set to true, Pjax appends a timestamp  to skip the browser cache.
    exclude:             # 被屏蔽的 url 地址将不启用 pjax 跳转，可以在控制台下使用 window.location.pathname 获取
  
  # NProgress
  nprogress:
    enable: false
    js: https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.min.js
    css: https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.min.css

  # 暗黑模式 darkmode
  # 开关按钮：在 navbar.menu 中添加：
  # - name: 暗黑模式 # 可自定义
  #   icon: fa-solid fa-moon # 可自定义
  #   toggle: darkmode
  darkmode:
    enable: true

############################### Plugins ############################### > end

############################### Rightmenu ############################### > start

############################
# 【自定义右键菜单】
# 数据组成：
# id: 唯一标识，用于区分、定位菜单项
# name: 显示在菜单中的名称
# icon: 显示图标的字符串，CSS 类
# link: 表明这是一个链接，记录链接地址
# linkTarget: 链接目标：'_self'（默认），'_blank'
# eventName: 事件名称，表示这是一个事件处理形式的菜单项
#  1.预设事件：
#     1.1 详见预设菜单的 eventName 值
#  2.外部事件:
#     2.1 尝试从 window 调用：window[eventName](menuItem, event, pointevent) menuItem: 菜单项数据; event: 点击事件; pointevent: 右键事件 
#     2.2 下方菜单配置时，可带参数 eventName: 'OpenSearch(selectedText)'  <=== 其中 selectedText 会被替换为实际选中的文本
#                      也可带替换标志 eventName: "open('https://cn.bing.com/search?q=##selectedText##')"  <=== 其中 ##selectedText## 会被替换为实际选中的文本
#                      ~详细逻辑参阅文档~
# displayCondition: 显示条件，用来控制菜单项的显示行为
#  1.预设条件：
#    1.1 输入框 (inInputField)：在输入框下开启右键菜单
#    1.2 文本选择 (selectedText)：在选择文本时开启右键菜单
#    1.3 图片链接 (onImage)：在图片上开启右键菜单
#    1.4 地址链接 (onLink)：在链接上开启右键菜单
#    1.5 文章页面 (articlePage)：在文章页面开启右键菜单
#    1.6 评论容器 (commentsPresent)：在存在评论容器的页面上开启右键菜单
#  2.外部条件：
#    2.1 尝试从 window 调用：window[displayCondition](menuItem, pointevent) menuItem: 菜单项数据; pointevent: 右键事件 
#    2.2 外部条件需返回 true/false，任何其它返回值将被忽略
#  3.留空或不设置 始终显示
#  4.满足条件的菜单项显示数量大于 maxMenuItems 时，隐藏所有链接型菜单
############################
rightmenus:
  enable: true
  options:
    navigation: true # 是否显示导航栏组件
    maxMenuItems: 12 # 最大菜单显示数量：见 👆
  navigation: 
    # 导航栏组件
    # 横向排列，仅显示图标
    # 定义顺序代表加载顺序
    - {id: 'left', name: '转到上一页', icon: 'feather arrow-left PETERRIVE', eventName: 'window.history.back'}
    - {id: 'right', name: '转到下一页', icon: 'feather arrow-right PETERRIVE', eventName: 'window.history.forward'}
    - {id: 'redo', name: '刷新当前页面', icon: 'feather refresh-ccw PETERRIVE', eventName: 'window.location.reload'}
    - {id: 'home', name: '回到首页', icon: 'feather home PETERRIVE', link: '/'}
    - {id: 'top', name: '回到顶部', icon: 'feather arrow-up PETERRIVE', eventName: 'scrollTop', displayCondition: 'scrolledFromTop'}
  menuList: 
    # 菜单项组件
    # 竖向排列，显示图标和菜单名称
    # 定义顺序代表加载顺序
    # 菜单分割：
    #  1.1 当相邻菜单项的 displayCondition 值不同时，自动添加分割线
    #  1.2 主动定义分割线时，自动判断关闭，根据 hr 定义位置添加分割线
    #      定义方式： hr, {}, {id: 'hr'}
    - {id: 'selectAllText', name: '全选文本', icon: 'feather type PETERRIVE', eventName: 'selectAllText', displayCondition: 'inInputField'}
    - {id: 'copyPaste', name: '粘贴内容', icon: 'feather clipboard PETERRIVE', eventName: 'copyPaste', displayCondition: 'inInputField'}
    - {id: 'cutText', name: '剪切文本', icon: 'feather scissors PETERRIVE', eventName: 'cutText', displayCondition: 'inInputField'}
    - {id: 'copyText', name: '复制文本', icon: 'feather copy PETERRIVE', eventName: 'copyText', displayCondition: 'selectedText'}
    - {id: 'searchWord', name: '站内搜索', icon: 'feather search PETERRIVE', eventName: 'OpenSearch(selectedText)', displayCondition: 'selectedText'}
    - {id: 'bingSearch', name: '必应搜索', icon: 'feather bold PETERRIVE', eventName: 'window.open("https://www.bing.com/search?q=##selectedText##")', displayCondition: 'selectedText'}
    - {id: 'prev', name: '查看上一篇', icon: 'feather arrow-up-circle PETERRIVE', eventName: "jumpArticle", displayCondition: 'articlePage'}
    - {id: 'next', name: '查看下一篇', icon: 'feather arrow-down-circle PETERRIVE', eventName: "jumpArticle", displayCondition: 'articlePage'}
    - {id: 'comment', name: '查看评论', icon: 'feather message-circle PETERRIVE', eventName: 'scrollComment', displayCondition: 'articlePage'}
    - {id: 'openTab', name: '新标签页打开', icon: 'feather external-link PETERRIVE', eventName: 'window.open(linkAddress)', displayCondition: 'onLink'}
    - {id: 'copyLink', name: '复制链接地址', icon: 'feather link PETERRIVE', eventName: 'copyLink', displayCondition: 'onLink'}
    - {id: 'copyImg', name: '复制图片文件', icon: 'feather image PETERRIVE', eventName: 'copyImg', displayCondition: 'onImage'}
    - {id: 'friends', name: '我的朋友们', icon: 'feather users AMETHYST', link: '/page/friends/'}
    - {id: 'archive', name: '文章归档', icon: 'feather archive CONCRETE', link: '/archives/'}
    - {id: 'categorie ', name: '文章分类', icon: 'feather folder-plus ALIZARIN', link: '/categories/'}
    - {id: 'about', name: '关于我', icon: 'feather smile WISTERIA', link: '/page/about/'}
    - {id: 'info', name: '留言板', icon: 'feather message-circle ALIZARIN', link: '/page/info/'}
    - {id: 'printMode', name: '打印页面', icon: 'feather printer TURQUOISE', eventName: 'printMode', displayCondition: 'articlePage'}
    - {id: 'readMode', name: '阅读模式', icon: 'feather book-open EMERALD', eventName: 'readMode', displayCondition: 'articlePage'}
    - {id: 'darkMode', name: '暗黑模式', icon: 'feather sun WISTERIA', eventName: 'volantis.dark.toggle'}


