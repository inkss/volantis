############################### Volantis ###############################
info:
  theme_name: Volantis # This is theme's name.
  theme_docs: https://volantis.js.org/ # This is theme's URL.
  theme_repo: https://github.com/volantis-x/hexo-theme-volantis

############################### 默认占位图 ###############################
default:
  avatar: https://cdn.jsdelivr.net/gh/cdn-x/placeholder@1.0.1/avatar/round/3442075.svg
  link: https://cdn.jsdelivr.net/gh/cdn-x/placeholder@1.0.1/link/8f277b4ee0ecd.svg
  cover: https://cdn.jsdelivr.net/gh/cdn-x/placeholder@1.0.1/cover/76b86c0226ffd.svg
  image: https://cdn.jsdelivr.net/gh/cdn-x/placeholder@1.0.1/image/2659360.svg


############################### CDN ###############################
# 直接填写资源 URL，用户可在 _config.volantis.yml 中覆盖任意 key
cdn:
  # 主题内部资源（本地路径）
  volantis_style: /css/style.css
  volantis_app: /js/app.js
  volantis_rightMenus: /js/plugins/rightMenus.js
  volantis_search_hexo: /js/search/hexo.js
  volantis_search_algolia: /js/search/algolia.js
  volantis_search_meilisearch: /js/search/meilisearch.js

  # 第三方库
  fancybox_css: https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0.31/dist/fancybox.css
  fancybox_js: https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0.31/dist/fancybox.umd.js
  algolia_search_v4: https://cdn.jsdelivr.net/npm/algoliasearch@4.14.2/dist/algoliasearch-lite.umd.js
  instantsearch_v4: https://cdn.jsdelivr.net/npm/instantsearch.js@4.44.0/dist/instantsearch.production.min.js
  instant_meilisearch: https://cdn.jsdelivr.net/npm/@meilisearch/instant-meilisearch@0.8.1/dist/instant-meilisearch.umd.min.js
  markdown: https://cdn.jsdelivr.net/npm/github-markdown-css@5.1.0/github-markdown.min.css
  marked: https://cdn.jsdelivr.net/npm/marked@4.0.18/marked.min.js
  hlsjs: https://cdn.jsdelivr.net/npm/hls.js@1.1.3/dist/hls.min.js
  iconfontInkss: /js/szyink/iconfontInkss.js






############################### CSP ###############################
# 内容安全策略( CSP ) meta 标签 http-equiv="Content-Security-Policy"
# https://developer.mozilla.org/zh-CN/docs/Web/HTTP/CSP
# https://content-security-policy.com/
# 也可以设为 false 在 HTTP 标头中设置 https://volantis.js.org/v5/advanced-settings/#设置-HTTP-响应标头


# 全局页面字符串替换  A => B (可用于临时修改错字等)
replace:
  - https://cdn.jsdelivr.net/npm/ => https://unpkg.com/
  - https://cdn.jsdelivr.net/gh/ => https://gcore.jsdelivr.net/gh/


# dns-prefetch preconnect x-dns-prefetch-control
dns_prefetch:
  # - https://unpkg.com
  # - https://npm.elemecdn.com


# 平滑滚动效果
scroll_smooth: true
############################### Navigation Bar ############################### > start
# 注意事项：建议规范全站路径 URL 最后带一个 "/" 例如 "about/"
navbar:
